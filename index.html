function isPair(list, n1, n2) {
  return list.some(p => (p[0] === n1 && p[1] === n2) || (p[0] === n2 && p[1] === n1));
}

function synergyScoreByName(nameA, nameB) {
  const a = SUBJECTS.find(s => s.name === nameA);
  const b = SUBJECTS.find(s => s.name === nameB);
  if (!a || !b) return 0;
  let score = a.tags.filter(t => b.tags.includes(t)).length;
  if (isPair(POSITIVE_PAIRS, nameA, nameB)) score += 3;
  if (isPair(NEGATIVE_PAIRS, nameA, nameB)) score -= 4;
  return score;
}

function computeSubjectTiers(selected) {
  const map = {};
  SUBJECTS.forEach(s => {
    if (selected.includes(s.name)) { map[s.name] = { tier: 'placed' }; return; }
    if (selected.length === 0) { map[s.name] = { tier: 'neutral' }; return; }
    const avg = selected.reduce((sum, sel) => sum + synergyScoreByName(s.name, sel), 0) / selected.length;
    let tier = 'neutral';
    if (avg >= 2) tier = 'high';
    else if (avg <= -1) tier = 'low';
    map[s.name] = { tier, avg };
  });
  return map;
}

// "함께 선택하면 좋은 과목" 추천 전용 함수. 전체 선택 과목을 단순 평균하면 서로 결이
// 다른 과목들이 뒤섞였을 때 점수가 다 같이 낮아지며 추천이 사실상 무의미해지는 문제가 있었다.
// 그 대신 선택 "순서"(history, 오래된→최신)에 지수적으로 감쇠하는 가중치를 줘서, 가장 최근에
// 고른 과목을 기준으로 추천하되 이전 과목들도 (약해지는 비중으로) 함께 고려한다.
// 정원이 남은 학기 소속 후보가 하나라도 있으면 항상 최소 1개 이상의 추천을 반환한다.
function computeRecommendations(history, placements) {
  if (history.length === 0) return [];
  const DECAY = 0.5;
  const n = history.length;
  const placedNames = new Set(SEMESTER_IDS.flatMap(id => placements[id]));
  const candidates = SUBJECTS.filter(s => !placedNames.has(s.name) && placements[s.semester].length < 4);
  const scored = candidates.map(s => {
    let weightedSum = 0;
    let totalWeight = 0;
    history.forEach((name, i) => {
      const weight = Math.pow(DECAY, n - 1 - i);
      weightedSum += weight * synergyScoreByName(s.name, name);
      totalWeight += weight;
    });
    return { subject: s, score: totalWeight > 0 ? weightedSum / totalWeight : 0 };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 5);
}

function computeDeptRanking(selected) {
  const results = DEPARTMENTS.map(dept => {
    const entries = Object.entries(dept.weights);
    const total = entries.reduce((s, e) => s + e[1], 0);
    const got = entries.reduce((s, e) => s + (selected.includes(e[0]) ? e[1] : 0), 0);
    const pct = total > 0 ? Math.round((got / total) * 100) : 0;
    return { dept, pct };
  });
  results.sort((a, b) => b.pct - a.pct || a.dept.name.localeCompare(b.dept.name));
  return results;
}

function getRecommendedSubjects(dept) {
  const entries = Object.entries(dept.weights).sort((a, b) => b[1] - a[1]);
  return { core: entries.slice(0, 3), advanced: entries.slice(3, 6) };
}

function topSubjectsForMajors(majorIds) {
  const totals = {};
  majorIds.forEach(id => {
    const d = DEPARTMENTS.find(x => x.id === id);
    if (!d) return;
    Object.entries(d.weights).forEach(([s, w]) => { totals[s] = (totals[s] || 0) + w; });
  });
  return Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0]);
}

function TreeTab() {
  const [s1, setS1] = useState(null);
  const [s2, setS2] = useState(null);
  const [s3, setS3] = useState(null);
  const [s4, setS4] = useState(null);
  const wrapRef = useRef(null);
  const nodeRefs = useRef({});
  const [lines, setLines] = useState([]);

  const stage2List = s1 ? STAGE2[s1] : [];
  const stage3List = s2 ? STAGE3[s2] : [];
  const stage4List = s3 ? STAGE4[s3] : [];
  const finalNode = s4 ? stage4List.find(n => n.id === s4) : null;
  const finalSubjects = finalNode ? topSubjectsForMajors(finalNode.majors) : [];

  function selectS1(id) { setS1(id); setS2(null); setS3(null); setS4(null); }
  function selectS2(id) { setS2(id); setS3(null); setS4(null); }
  function selectS3(id) { setS3(id); setS4(null); }
  function selectS4(id) { setS4(id); }
  function reset() { setS1(null); setS2(null); setS3(null); setS4(null); }

  function computeLines() {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const cRect = wrap.getBoundingClientRect();
    const getCenter = id => {
      const el = nodeRefs.current[id];
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - cRect.left, y: r.top + r.height / 2 - cRect.top };
    };
    const newLines = [];
    const pairs = [['root', s1], [s1, s2], [s2, s3], [s3, s4]];
    pairs.forEach(([from, to]) => {
      if (!from || !to) return;
      const a = getCenter(from), b = getCenter(to);
      if (a && b) newLines.push([a, b]);
    });
    setLines(newLines);
  }

  useLayoutEffect(() => {
    computeLines();
    window.addEventListener('resize', computeLines);
    return () => window.removeEventListener('resize', computeLines);
  }, [s1, s2, s3, s4]);

  return (
    <div className="animate-fadeInUp">
      <div className="glass rounded-3xl p-6 md:p-8 shadow-neon">
        <h2 className="text-xl md:text-2xl font-bold mb-1">🌳 적성 스킬트리 (4단계)</h2>

            <defs>
              <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#22e6ff" />
                <stop offset="100%" stopColor="#8b5cf6" />
              </linearGradient>
            </defs>
            {lines.map((pts, i) => (
              <line key={i} x1={pts[0].x} y1={pts[0].y} x2={pts[1].x} y2={pts[1].y} stroke="url(#lineGrad)" strokeWidth="2.5" strokeLinecap="round" />
            ))}
          </svg>

          <div className="relative z-10 flex flex-col items-center gap-8 py-4">
            <div
              ref={el => (nodeRefs.current['root'] = el)}
              className="rounded-full w-24 h-24 flex flex-col items-center justify-center glass border border-neon-cyan/40 shadow-neon animate-floaty font-bold text-xs text-center"
            >
              <span className="text-xl">🌱</span>
              START
            </div>

            <div className="flex gap-4 flex-wrap justify-center">
              {STAGE1.map(n => (
                <TreeNode key={n.id} innerRef={el => (nodeRefs.current[n.id] = el)} active={s1 === n.id} onClick={() => selectS1(n.id)} label={n.label} sub={n.sub} icon={n.icon} />
              ))}
            </div>

            {s1 && (
              <div className="flex gap-4 flex-wrap justify-center animate-fadeInUp">
                {stage2List.map(n => (
                  <TreeNode key={n.id} innerRef={el => (nodeRefs.current[n.id] = el)} active={s2 === n.id} onClick={() => selectS2(n.id)} label={n.label} small />
                ))}
              </div>
            )}

            {s2 && (
              <div className="flex gap-4 flex-wrap justify-center animate-fadeInUp">
                {stage3List.map(n => (
                  <TreeNode key={n.id} innerRef={el => (nodeRefs.current[n.id] = el)} active={s3 === n.id} onClick={() => selectS3(n.id)} label={n.label} small />
                ))}
              </div>
            )}

            {s3 && (
              <div className="flex gap-4 flex-wrap justify-center animate-fadeInUp">
                {stage4List.map(n => (
                  <TreeNode key={n.id} innerRef={el => (nodeRefs.current[n.id] = el)} active={s4 === n.id} onClick={() => selectS4(n.id)} label={n.label} small />
                ))}
              </div>
            )}
          </div>
        </div>
      </div>

      {finalNode && (
        <div className="mt-8 glass rounded-3xl p-6 md:p-8 animate-popIn shadow-neonPink max-w-2xl mx-auto text-center">
          <div className="text-sm text-neon-cyan font-semibold mb-1">추천 학과 리스트</div>
          <h4 className="text-xl font-bold mb-4">{finalNode.label}</h4>
          <div className="flex flex-wrap gap-2 justify-center mb-5">
            {finalNode.majors.map(mid => {
              const d = DEPARTMENTS.find(x => x.id === mid);
              return (
                <span key={mid} className="px-4 py-2 rounded-full bg-gradient-to-r from-neon-purple/30 to-neon-pink/30 border border-white/10 text-sm font-medium">
                  {d ? d.name : mid}
                </span>
              );
            })}
          </div>
          {finalSubjects.length > 0 && (
            <div>
              <div className="text-xs text-slate-500 mb-2">🎓 관련 고교 선택과목</div>
              <div className="flex flex-wrap gap-2 justify-center">

            );
          })}
        </div>
      </div>

      {totalPlaced >= 2 && (
        <div className="glass rounded-3xl p-5 md:p-6 mb-6 border border-emerald-400/30 shadow-neonGreen animate-fadeInUp">
          {recommendations.length > 0 ? (
            <React.Fragment>
              <h3 className="font-bold text-base mb-1 flex items-center gap-2">
                <span>🎯</span> 지금까지 고른 {totalPlaced}개 과목과 함께 선택하면 좋은 과목
              </h3>
              <p className="text-slate-500 text-xs mb-4">방금 고른 과목을 중심으로, 이전에 고른 과목들도 함께 고려한 추천입니다. 클릭하면 바로 담겨요.</p>
              <div className="flex flex-wrap gap-2.5">
                {recommendations.map(r => {
                  const meta = SEMESTER_META[r.subject.semester];
                  return (
                    <button
                      key={r.subject.name}
                      onClick={() => toggleSubject(r.subject.name)}
                      className="flex items-center gap-2 pl-2.5 pr-4 py-2 rounded-full bg-emerald-500/15 border border-emerald-400/50 text-emerald-200 text-sm font-semibold hover:bg-emerald-500/25 hover:scale-105 transition-all duration-300"
                    >
                      <span className={'text-[10px] font-bold px-1.5 py-0.5 rounded-full ' + meta.chipBg + ' ' + meta.chipText}>
                        {SEMESTER_LABELS[r.subject.semester]}
                      </span>
                      {r.subject.name}
                    </button>
                  );
                })}
              </div>
            </React.Fragment>
          ) : (
            <h3 className="font-bold text-base flex items-center gap-2">
              <span>🎉</span> 4개 학기를 모두 채웠어요! 16개 과목 선택이 완성됐습니다.
            </h3>
          )}
        </div>
      )}

      <div className="grid lg:grid-cols-[1fr_340px] gap-6 items-start">
        <div className="grid md:grid-cols-2 gap-5">
          {SEMESTER_IDS.map(semId => (
            <SemesterSection
              key={semId}
              semId={semId}
              subjects={bySemester[semId]}
              placed={placements[semId]}
              tiers={tiers}
              onToggle={toggleSubject}
            />
          ))}
        </div>

        <div className="glass rounded-3xl p-6 shadow-neonPink lg:sticky lg:top-4">
          <h3 className="font-bold text-lg mb-1">🏆 실시간 추천 학과 TOP 5</h3>
          <p className="text-slate-400 text-xs mb-4">130개 학과 중 {totalPlaced}개 과목 기준 매칭</p>

          {totalPlaced === 0 ? (
            <div className="text-sm text-slate-500 py-10 text-center">과목을 학기에 배치하면<br />매칭 학과가 표시됩니다.</div>
          ) : (
            <div className="relative overflow-hidden" style={{ height: ROW_H * 5 }}>
              {ranking.map((r, idx) => (
                <div
                  key={r.dept.id}
                  className={'absolute left-0 right-0 transition-all duration-500 ease-in-out ' + (idx < 5 ? 'opacity-100' : 'opacity-0 pointer-events-none')}
                  style={{ top: Math.min(idx, 5) * ROW_H }}
                >
                  <div className="glass rounded-2xl p-3 mb-2 border border-white/10">
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-sm flex items-center gap-1 truncate">
                        <span>{['🥇', '🥈', '🥉', '4️⃣', '5️⃣'][idx] || ''}</span>
                        <span className="truncate">{r.dept.name}</span>
                      </span>
                      <span className="text-neon-cyan font-bold text-sm shrink-0">{r.pct}%</span>
                    </div>
                    <div className="h-2 rounded-full bg-white/10 overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-neon-cyan to-neon-pink transition-all duration-500" style={{ width: `${r.pct}%` }}></div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="mt-4 text-[11px] text-slate-500 leading-relaxed">
            💡 예: '미적분Ⅱ'(3학년 1학기)와 '물리학'(2학년 1학기)을 함께 배치하면 기계공학과·전자공학과의 매칭률이 크게 올라가요.
          </div>
        </div>
      </div>
    </div>
  );
}

/* ==================================================================== */
/* 9. App                                                                */
/* ==================================================================== */

function App() {
  const [tab, setTab] = useState('search');
  // placements(학기별 배치)와 history(고른 순서, 오래된→최신)를 하나의 state로 묶어서
  // 함수형 업데이터 안에서 "항상 함께" 갱신한다. 예전에는 이 둘을 별도의 useState로 두고
  // setPlacements → setSelectionHistory 순서로 두 번 호출했는데, 그 사이에서 history가
  // placements와 어긋나(비어있는 채로 남는 등) 추천이 계속 비어 보이는 버그가 있었다.
  // 하나의 객체로 묶어 한 번에 갱신하면 이 둘이 서로 어긋날 수가 없다.
  const [subjectState, setSubjectState] = useState({
    placements: { '2-1': [], '2-2': [], '3-1': [], '3-2': [] },
    history: [],
  });
  const placements = subjectState.placements;
  const selectionHistory = subjectState.history;
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  function showToast(message) { setToast({ id: Date.now(), message }); }

  // setSubjectState의 함수형 업데이터 안에서 '검증 + placements/history 갱신'을 한 번에
  // 수행해야, 연속 클릭이 겹쳐도 항상 최신 상태를 기준으로 학기당 4과목(택4) 제한을 정확히
  // 검사하고, placements와 history가 항상 같은 스냅샷을 반영하도록 보장할 수 있다.
  function toggleSubject(subjectName) {
    const subj = SUBJECTS.find(s => s.name === subjectName);
    if (!subj) return;
    const semId = subj.semester;
    let msg = null;
    setSubjectState(prev => {
      const prevPl = prev.placements;
      if (prevPl[semId].includes(subjectName)) {
        msg = `↩️ '${subjectName}'을(를) 배치에서 제거했습니다.`;
        return {
          placements: { ...prevPl, [semId]: prevPl[semId].filter(n => n !== subjectName) },
          history: prev.history.filter(n => n !== subjectName),
        };
      }
      if (prevPl[semId].length >= 4) {
        msg = '⚠️ 해당 학기의 선택 이수 단위(4과목)가 초과되었습니다.';
        return prev;
      }
      msg = `✅ '${subjectName}'을(를) ${SEMESTER_LABELS[semId]}에 배치했습니다.`;
      return {
        placements: { ...prevPl, [semId]: [...prevPl[semId], subjectName] },
        history: [...prev.history.filter(n => n !== subjectName), subjectName],
      };
    });
    if (msg) showToast(msg);
  }

  // 기능1(학과 검색)의 "핵심 과목 자동 배치" 버튼에서 호출된다. 이미 배치된 과목은 건드리지
  // 않고, 아직 없는 핵심 과목만 각자의 개설 학기에 채워 넣은 뒤 기능3 탭으로 이동시킨다.
  function autoFillFromDept(dept) {
    const rec = getRecommendedSubjects(dept);
    const names = rec.core.map(([name]) => name);
    let added = 0, dup = 0, full = 0;
    setSubjectState(prev => {
      const nextPl = { '2-1': [...prev.placements['2-1']], '2-2': [...prev.placements['2-2']], '3-1': [...prev.placements['3-1']], '3-2': [...prev.placements['3-2']] };
      const addedNames = [];
      names.forEach(name => {
        const subj = SUBJECTS.find(s => s.name === name);
        if (!subj) return;
        const semId = subj.semester;
        if (nextPl[semId].includes(name)) { dup++; return; }
        if (nextPl[semId].length >= 4) { full++; return; }
        nextPl[semId] = [...nextPl[semId], name];
        added++;
        addedNames.push(name);
      });
      return {
        placements: nextPl,
        history: [...prev.history.filter(n => !addedNames.includes(n)), ...addedNames],
      };
    });
    let msg = `🚀 '${dept.name}' 핵심 과목 ${added}개를 학기별로 자동 배치했습니다.`;
    if (dup > 0) msg += ` (이미 담긴 과목 ${dup}개)`;
    if (full > 0) msg += ` (학기 정원 초과로 ${full}개는 담지 못했습니다)`;
    showToast(msg);
    setTab('selector');
  }

  return (
    <div className="relative">
      <div className="fixed -top-32 -left-32 w-96 h-96 bg-neon-purple/20 rounded-full blur-3xl pointer-events-none"></div>
      <div className="fixed -bottom-32 -right-32 w-96 h-96 bg-neon-cyan/20 rounded-full blur-3xl pointer-events-none"></div>

      <div className="relative max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-12">
        <Header />
        <nav className="flex gap-3 justify-center mb-10 flex-wrap">
          <TabButton active={tab === 'search'} onClick={() => setTab('search')} icon="🔍" label="학과 검색" />
          <TabButton active={tab === 'tree'} onClick={() => setTab('tree')} icon="🌳" label="적성 스킬트리" />
          <TabButton active={tab === 'selector'} onClick={() => setTab('selector')} icon="🗓️" label="학기별 과목 배치" />
        </nav>
        <main>
          {tab === 'search' && <SearchTab onAutoFill={autoFillFromDept} />}
          {tab === 'tree' && <TreeTab />}
          {tab === 'selector' && <SelectorTab placements={placements} toggleSubject={toggleSubject} selectionHistory={selectionHistory} />}
        </main>
        <footer className="text-center text-xs text-slate-600 mt-16">
          © 2026 과목내비 · 경문고 2026학년도 입학생(2022 개정 교육과정) 학점 배당표 기반 · 8대 계열 130개 학과 데모 데이터
        </footer>
      </div>

      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
